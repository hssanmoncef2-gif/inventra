version: '3.9'

# ═══════════════════════════════════════════════════════════════
#  INVENTRA — Docker Compose
#  Free AI via Ollama (llama3.2) — no API key needed
#
#  DEPLOY:
#    docker compose up -d
#
#  CHECK AI STATUS:
#    docker compose logs -f ollama-init
#    docker compose logs backend
# ═══════════════════════════════════════════════════════════════

services:

  # ── MongoDB ────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: inventra-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventory_db
    networks:
      - inventra-net

  # ── Ollama AI Server ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: inventra-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - inventra-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # ── GPU (optional, NVIDIA only) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Model Downloader (runs once, retries until Ollama ready) ─
  ollama-init:
    image: curlimages/curl:latest
    container_name: inventra-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    entrypoint: >
      sh -c "
        MODEL=$${OLLAMA_MODEL:-llama3.2};
        HOST=$${OLLAMA_HOST:-http://ollama:11434};
        echo 'Waiting for Ollama at '$$HOST'...';
        until curl -sf $$HOST/api/tags > /dev/null 2>&1; do
          echo 'Ollama not ready yet, retrying in 5s...';
          sleep 5;
        done;
        echo 'Ollama is up! Checking model '$$MODEL'...';
        if curl -sf $$HOST/api/tags | grep -q $$MODEL; then
          echo 'Model already downloaded. Done!';
        else
          echo 'Pulling model '$$MODEL' (first time only, may take minutes)...';
          curl -sf $$HOST/api/pull -X POST -H 'Content-Type: application/json' -d '{\"name\":\"'$$MODEL'\",\"stream\":false}';
          echo 'Model pull complete!';
        fi
      "
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - inventra-net

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/inventory_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-in-production-32chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@inventra.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin1234!}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_ALT: ${FRONTEND_URL_ALT:-http://127.0.0.1:3000}
      UPLOAD_DIR: uploads
      BACKUP_DIR: backups
    volumes:
      - backend-uploads:/app/uploads
      - backend-backups:/app/backups
    depends_on:
      mongo:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - inventra-net

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventra-net

volumes:
  mongo-data:
  ollama-data:
  backend-uploads:
  backend-backups:

networks:
  inventra-net:
    driver: bridge
