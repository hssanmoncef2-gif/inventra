version: '3.9'

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: inventra-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventory_db
    networks:
      - inventra-net

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/inventory_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-in-production-32chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-hssanmoncef@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-13579Moncef}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your_key_here}
      # Accept requests from both localhost and any IP (for LAN access)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_ALT: ${FRONTEND_URL_ALT:-http://127.0.0.1:3000}
      UPLOAD_DIR: uploads
      BACKUP_DIR: backups
    volumes:
      - backend-uploads:/app/uploads
      - backend-backups:/app/backups
    depends_on:
      - mongo
    networks:
      - inventra-net

  # Frontend (Nginx serving built React app)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventra-net

volumes:
  mongo-data:
  backend-uploads:
  backend-backups:

networks:
  inventra-net:
    driver: bridge
